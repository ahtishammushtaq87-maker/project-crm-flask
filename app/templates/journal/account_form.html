{% extends "base.html" %}
{% block title %}{{ 'Edit' if account else 'New' }} Account{% endblock %}

{% block content %}
<div class="container" style="max-width: 640px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">
                <i class="fas fa-book me-2"></i>{{ 'Edit Account' if account else 'Create Account' }}
            </h5>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Account Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required
                           value="{{ account.name if account else '' }}"
                           placeholder="e.g., Cash, Bank, Office Expense">
                </div>
                <div class="mb-3">
                    <label class="form-label">Type <span class="text-muted small">(optional)</span></label>
                    <input type="text" name="account_type" class="form-control"
                           value="{{ account.account_type if account else '' }}"
                           placeholder="e.g., Cash / Bank / Expense / Income">
                </div>
                <div class="mb-3">
                    <label class="form-label">Opening Balance</label>
                    <input type="number" step="0.01" name="opening_balance" class="form-control"
                           value="{{ account.opening_balance if account else 0 }}">
                    <div class="form-text">Starting money in this account.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Notes <span class="text-muted small">(optional)</span></label>
                    <textarea name="notes" class="form-control" rows="2">{{ account.notes if account else '' }}</textarea>
                </div>
                {% if account %}
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" name="is_active" id="isActive"
                           {% if account.is_active %}checked{% endif %}>
                    <label class="form-check-label" for="isActive">Active</label>
                </div>
                {% endif %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>{{ 'Update' if account else 'Create' }}
                    </button>
                    <a href="{{ url_for('journal.accounts') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
