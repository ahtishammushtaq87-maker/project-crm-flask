<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Portal - {% block title %}{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Same look as the login page (auth/login.html). */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0052CC; --primary-light: #0063FF; --secondary: #6366F1;
            --success: #10B981; --danger: #EF4444; --warning: #F59E0B;
            --bg-light: #F9FAFB; --text-dark: #1F2937; --text-muted: #6B7280; --border: #E5E7EB;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0052CC 0%, #0063FF 50%, #6366F1 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            color: var(--text-dark); padding: 20px;
        }
        .auth-card {
            width: 100%; max-width: 460px; background: #fff; border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.12); padding: 44px 40px 36px;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        .auth-icon {
            width: 60px; height: 60px; border-radius: 16px; margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px;
            box-shadow: 0 10px 20px rgba(0, 82, 204, 0.25);
        }
        h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 8px; }
        .auth-sub { color: var(--text-muted); font-size: 14.5px; line-height: 1.55; margin-bottom: 26px; }
        .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 14px; display: flex; gap: 10px; line-height: 1.45; }
        .alert i { margin-top: 2px; }
        .alert-danger, .alert-error { background: rgba(239, 68, 68, 0.08); color: #B91C1C; border: 1px solid rgba(239, 68, 68, 0.3); }
        .alert-success { background: rgba(16, 185, 129, 0.08); color: #047857; border: 1px solid rgba(16, 185, 129, 0.3); }
        .alert-warning { background: rgba(245, 158, 11, 0.1); color: #B45309; border: 1px solid rgba(245, 158, 11, 0.35); }
        .alert-info { background: rgba(0, 82, 204, 0.06); color: #1E40AF; border: 1px solid rgba(0, 82, 204, 0.2); }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .form-label i { margin-right: 6px; color: var(--primary); }
        .form-control {
            width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 10px;
            font-size: 14px; font-family: 'Inter', sans-serif; background: var(--bg-light); transition: all 0.2s ease;
        }
        .form-control:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.1); }
        .form-control.is-invalid { border-color: var(--danger); background: rgba(239, 68, 68, 0.04); }
        .invalid-feedback { font-size: 12.5px; color: var(--danger); margin-top: 6px; display: block; }
        .form-hint { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }
        .btn-primary {
            width: 100%; padding: 14px; border: 0; border-radius: 10px; cursor: pointer;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #fff; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform 0.15s ease, box-shadow 0.15s ease; margin-top: 6px;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(0, 82, 204, 0.3); }
        .btn-primary:disabled { opacity: 0.75; transform: none; cursor: wait; }
        .auth-foot { text-align: center; margin-top: 22px; font-size: 14px; }
        .auth-foot a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .auth-foot a:hover { text-decoration: underline; }
        .pw-wrap { position: relative; }
        .pw-wrap .form-control { padding-right: 44px; }
        .pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; background: none; border: 0; }
        .pw-toggle:hover { color: var(--primary); }
        @media (max-width: 480px) { .auth-card { padding: 32px 22px 28px; border-radius: 14px; } h1 { font-size: 22px; } }
    </style>
</head>
<body>
    <main class="auth-card">
        {% block card %}{% endblock %}
    </main>
    <script>
        // Show/hide password buttons
        document.querySelectorAll('[data-pw-toggle]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.getAttribute('data-pw-toggle'));
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.querySelector('i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
            });
        });
        // Prevent double submission
        document.querySelectorAll('form[data-once]').forEach(function (f) {
            f.addEventListener('submit', function () {
                var b = f.querySelector('button[type=submit]');
                if (b) { b.disabled = true; b.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Please wait…'; }
            });
        });
    </script>
</body>
</html>
