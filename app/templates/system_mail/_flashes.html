{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<div class="alert alert-{{ category }}" role="alert">
    <i class="fas {{ 'fa-check-circle' if category == 'success' else ('fa-exclamation-triangle' if category == 'warning' else ('fa-info-circle' if category == 'info' else 'fa-exclamation-circle')) }}"></i>
    <span>{{ message }}</span>
</div>
{% endfor %}
{% endwith %}
