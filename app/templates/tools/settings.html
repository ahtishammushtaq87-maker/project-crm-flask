{% extends "base.html" %}
{% block title %}Voucher Settings{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <h2 class="h3 mb-0 text-gray-800">Voucher Settings</h2>
        <a href="{{ url_for('tools.receiving_list') }}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Back to Tools
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Numbering & Prefixes</h5>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <h6 class="text-primary mb-3"><i class="fas fa-arrow-down me-2"></i>Receiving Tools</h6>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Prefix</label>
                                <input type="text" name="receiving_prefix" class="form-control"
                                    value="{{ settings.receiving_prefix }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Next Number</label>
                                <input type="number" name="next_receiving_number" class="form-control"
                                    value="{{ settings.next_receiving_number }}">
                            </div>
                        </div>

                        <hr>

                        <h6 class="text-danger mb-3"><i class="fas fa-arrow-up me-2"></i>Delivering Tools</h6>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Prefix</label>
                                <input type="text" name="delivering_prefix" class="form-control"
                                    value="{{ settings.delivering_prefix }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Next Number</label>
                                <input type="number" name="next_delivering_number" class="form-control"
                                    value="{{ settings.next_delivering_number }}">
                            </div>
                        </div>

                        <div class="mt-4 border-top pt-3 text-center">
                            <button type="submit" class="btn btn-success px-5 fw-bold">
                                <i class="fas fa-save me-2"></i> Save Settings
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
